[package]
name = "mrio-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mrio"
path = "src/main.rs"

[dependencies]
mrio-core = { path = "../mrio-core", features = ["native"] }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
